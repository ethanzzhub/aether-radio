<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101819">
<meta name="description" content="AETHER 全球电波地图 — 在三维地球上探索并收听来自世界各地的电台。">
<title>AETHER · 全球电波地图</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">

  <!-- ============ 顶栏 ============ -->
  <header class="topbar">
    <div class="brand" aria-label="AETHER 全球电波地图">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="13"/><ellipse cx="16" cy="16" rx="5.5" ry="13"/><path d="M3.5 16h25"/><path d="M6.4 8.2h19.2M6.4 23.8h19.2"/></svg>
      </span>
      <span class="brand-text">
        <strong>AETHER</strong>
        <small>全球电波地图</small>
      </span>
    </div>

    <div class="search" id="searchWrap">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="searchInput" type="search" autocomplete="off" placeholder="搜索电台、城市、语言或音乐风格…" aria-label="搜索电台">
      <kbd class="search-kbd" id="searchKbd">/</kbd>
      <button class="search-clear" id="searchClear" type="button" aria-label="清空搜索" hidden>×</button>
      <div class="suggest" id="suggest" hidden></div>
    </div>

    <div class="top-actions">
      <button class="pill-btn" id="favBtn" type="button" aria-pressed="false" title="只看收藏">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.3 4.5 13a4.6 4.6 0 0 1 6.5-6.5l1 1 1-1a4.6 4.6 0 0 1 6.5 6.5Z"/></svg>
        <span>收藏</span>
        <b id="favCount">0</b>
      </button>
      <div class="view-switch" role="tablist" aria-label="视图切换">
        <button class="is-active" data-view="globe" role="tab" aria-selected="true" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>
          <span>地球</span>
        </button>
        <button data-view="list" role="tab" aria-selected="false" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
          <span>列表</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ============ 筛选栏 ============ -->
  <div class="filterbar">
    <div class="filter-scroll" id="genreChips" aria-label="音乐风格筛选"></div>
    <div class="filter-meta" id="resultMeta" aria-live="polite">正在连接电台目录…</div>
  </div>

  <!-- ============ 主内容 ============ -->
  <main class="main">

    <!-- 地球视图 -->
    <section class="view view-globe is-active" id="globeView" aria-label="地球电台地图">
      <div class="globe-stage" id="globeStage">
        <div id="globeContainer"></div>
        <div class="globe-vignette" aria-hidden="true"></div>
        <div class="globe-compass" aria-hidden="true"><span>N</span></div>
        <div class="map-mode-switch" id="mapModeSwitch" role="group" aria-label="地图模式">
          <button data-mode="3d" class="is-active" type="button" title="3D 地球">3D</button>
          <button data-mode="2d" type="button" title="2D 地图（兼容模式）">2D</button>
        </div>
        <div class="globe-guide" id="globeGuide">
          <span class="guide-dot"></span> 拖动旋转 · 滚轮缩放 · 点击光点收听
        </div>
        <button class="reset-btn" id="resetGlobe" type="button" title="回到初始视角">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          重置视角
        </button>
      </div>

      <aside class="spotlight" id="spotlight">
        <div class="spotlight-empty" id="spotlightEmpty">
          <span class="orbit-icon" aria-hidden="true"><i></i><i></i><b></b></span>
          <h2>在地球上发现声音</h2>
          <p>每一个光点，都是一座正在广播的城市。点击任意光点开始收听，或用上方搜索框寻找你熟悉的声音。</p>
          <div class="spotlight-stats">
            <div><strong id="statStations">—</strong><span>座电台</span></div>
            <div><strong id="statCountries">—</strong><span>个国家</span></div>
          </div>
        </div>
        <div class="spotlight-detail" id="spotlightDetail" hidden>
          <div class="detail-topline"><span class="live-tag"><i></i> ON AIR</span><button class="detail-close" id="detailClose" type="button" aria-label="关闭详情">×</button></div>
          <div class="detail-logo" id="detailLogo"></div>
          <h2 id="detailName">—</h2>
          <p class="detail-place" id="detailPlace">—</p>
          <div class="detail-tags" id="detailTags"></div>
          <div class="detail-actions">
            <button class="primary-btn" id="detailPlay" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg>
              <span>开始收听</span>
            </button>
            <button class="heart-btn" id="detailFav" type="button" aria-label="收藏电台">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.3 4.5 13a4.6 4.6 0 0 1 6.5-6.5l1 1 1-1a4.6 4.6 0 0 1 6.5 6.5Z"/></svg>
            </button>
          </div>
          <dl class="detail-meta" id="detailMeta"></dl>
          <a class="detail-link" id="detailHome" href="#" target="_blank" rel="noopener noreferrer" hidden>访问电台官网 <span>↗</span></a>
        </div>
      </aside>
    </section>

    <!-- 列表视图 -->
    <section class="view view-list" id="listView" aria-label="电台列表">
      <div class="list-head">
        <div>
          <p class="eyebrow">STATION DIRECTORY</p>
          <h2 id="listTitle">全球电台</h2>
        </div>
        <div class="list-controls">
          <div class="list-filter">
            <label for="countrySelect">国家</label>
            <select id="countrySelect">
              <option value="">全部国家</option>
            </select>
          </div>
          <div class="list-sort">
            <label for="sortSelect">排序</label>
            <select id="sortSelect">
              <option value="votes">最多投票</option>
              <option value="clickcount">最多收听</option>
              <option value="name">名称 A–Z</option>
              <option value="bitrate">音质优先</option>
            </select>
          </div>
        </div>
      </div>
      <div class="station-grid" id="stationGrid"></div>
      <div class="empty-state" id="listEmpty" hidden>
        <span aria-hidden="true">◌</span>
        <h3>没有找到匹配的电台</h3>
        <p>试试更短的关键词，或切换一个音乐风格。</p>
      </div>
      <button class="more-btn" id="loadMore" type="button" hidden>加载更多电台</button>
    </section>
  </main>

  <!-- ============ 播放器 ============ -->
  <footer class="player" id="player">
    <div class="player-track">
      <div class="track-art" id="trackArt"><span aria-hidden="true">◉</span></div>
      <div class="track-info">
        <div class="track-name" id="trackName">尚未选择电台</div>
        <div class="track-sub" id="trackSub">从地球或列表中选择一个电台开始收听</div>
      </div>
      <button class="player-fav" id="playerFav" type="button" aria-label="收藏当前电台" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.3 4.5 13a4.6 4.6 0 0 1 6.5-6.5l1 1 1-1a4.6 4.6 0 0 1 6.5 6.5Z"/></svg>
      </button>
    </div>

    <div class="player-center">
      <button class="transport" id="prevBtn" type="button" title="上一个" aria-label="上一个电台">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14L8 12Z"/><path d="M6 5v14"/></svg>
      </button>
      <button class="play-btn" id="playBtn" type="button" aria-label="播放" disabled>
        <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg>
        <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
        <span class="play-loader" aria-hidden="true"></span>
      </button>
      <button class="transport" id="nextBtn" type="button" title="下一个" aria-label="下一个电台">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14l10-7Z"/><path d="M18 5v14"/></svg>
      </button>
    </div>

    <div class="player-side">
      <span class="live-label" id="liveLabel"><i></i> LIVE</span>
      <svg class="vol-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9Z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8" aria-label="音量">
      <span class="vol-num" id="volNum">80</span>
    </div>
    <div class="player-progress" id="playerProgress" aria-hidden="true"></div>
  </footer>

  <audio id="audio" preload="none"></audio>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="boot" id="boot">
    <div class="boot-inner"><span class="boot-ring"></span><p>正在调谐全球频率…</p></div>
  </div>
</div>

<script src="vendor/globe.gl.min.js"></script>
<script src="js/world-geo.js"></script>
<script src="js/flat-map.js"></script>
<script src="js/builtin-stations.js"></script>
<script src="js/fallback.js"></script>
<script src="js/app.js"></script>
</body>
</html>
